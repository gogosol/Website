name: secret scan

# Why this workflow exists.
#
# On 2026-04-14 a live Resend API key was committed to this repository in
# `.dev.vars` and pushed to GitHub. A later commit removed the file from the
# index, which removes it from the WORKING TREE and from nothing else: the blob
# stayed reachable from `main`, so the credential remained readable by anyone
# who could read the repository, and by anything that had already cloned it.
#
# It went unnoticed for one reason. QuantumHalon and Vendor_Plane both gate every
# push with a full-history gitleaks scan; this repository had no CI at all, so
# nothing ever looked. The sibling repositories stayed green precisely because
# they were the only ones being checked.
#
# This runs the same pinned scanner over the same surface, so all three
# repositories now fail closed on the same evidence.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # At 05:23 on every third day of the month.
    - cron: "23 5 */3 * *"

permissions:
  contents: read

concurrency:
  group: website-secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  secret-scan:
    name: full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The whole point is the history, not the merge tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Reject tracked secret-bearing files
        run: |
          set -euo pipefail
          fail=0

          # `.dev.vars` is how this repository leaked. It is a Cloudflare
          # Workers local-secrets file, it is in .gitignore, and it must never
          # be tracked again, including via `git add -f`.
          tracked=$(git ls-files -- \
            '.dev.vars' '*/.dev.vars' \
            '.env' '*/.env' '.env.*' '*/.env.*' \
            '*.key' '*.pem' '*.p12' '*.pfx' '*.pkcs12' '*.jks' \
            ':(exclude).env.example' \
            || true)
          if [ -n "$tracked" ]; then
            echo "FAIL: secret-bearing files are tracked in git:"
            echo "$tracked"
            fail=1
          fi

          hits=$(git grep -lI -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' -- . || true)
          if [ -n "$hits" ]; then
            echo "FAIL: tracked files contain a PRIVATE KEY PEM block:"
            echo "$hits"
            fail=1
          fi

          # Provider prefixes that are unambiguous enough to assert on. `re_` is
          # Resend, the provider this repository actually leaked.
          tokens=$(git grep -lI -E \
            '(re_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{82,255}|xox[baprs]-[A-Za-z0-9-]{10,})' \
            -- . ':(exclude).github/workflows/secret-scan.yml' \
            || true)
          if [ -n "$tokens" ]; then
            echo "FAIL: files contain a high-confidence credential pattern:"
            echo "$tokens"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Secrets belong in the deployment platform's secret store, never in git."
            exit 1
          fi
          echo "OK: no tracked secret-bearing files"

      - name: Gitleaks full reachable history (checksum-pinned binary)
        run: |
          set -euo pipefail
          readonly version=8.30.1
          readonly archive="gitleaks_${version}_linux_x64.tar.gz"
          readonly sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum --check --strict -
          tar xzf "$archive" gitleaks
          ./gitleaks version
          ./gitleaks git --no-banner --redact --exit-code 1 \
            --log-opts="--all" \
            --max-decode-depth 3 --max-archive-depth 2 .
